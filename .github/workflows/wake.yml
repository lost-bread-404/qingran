name: wake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Qingran if he wants to reach out
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://qingran.app/api/cron/wake
